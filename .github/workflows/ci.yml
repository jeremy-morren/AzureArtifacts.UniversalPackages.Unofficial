name: CI

on:
  pull_request:
  # draft.yml runs the same build and tests before it drafts a release.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      results: ${{ github.workspace }}/src/artifacts/test-results
      coverage: ${{ github.workspace }}/src/artifacts/coverage
      solution: src/AzureArtifacts.UniversalPackages.Unofficial.slnx
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            3.1.x
            6.0.x
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build ${{ env.solution }} -c Release

      - name: Test
        run: >-
          dotnet test ${{ env.solution }} -c Release
          "-p:EmitCompilerGeneratedFiles=true"
          --collect "Code Coverage;Format=cobertura"
          --logger trx
          --results-directory "${{ env.results }}"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: ${{ !cancelled() }}
        with:
          check_name: Test results
          files: ${{ env.results }}/**/*.trx
          job_summary: true

      # Merges the per-framework reports
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        if: ${{ !cancelled() }}
        with:
          reports: ${{ env.results }}/**/*.cobertura.xml
          targetdir: ${{ env.coverage }}
          reporttypes: MarkdownSummaryGithub;Cobertura
          # The AzureArtifacts.UniversalPackages* assemblies, except the tests (as src/codecoverage.runsettings.xml collects)
          assemblyfilters: +AzureArtifacts.UniversalPackages*;-*.Tests
          # The deterministic build's source paths (/_/...) are relative to the repository root, including the source
          # generators' output (EmitCompilerGeneratedFiles)
          sourcedirs: ${{ github.workspace }}
          # Leave out source-generated files (e.g. the JSON and logging generators')
          filefilters: -*.g.cs
          title: Code coverage

      # The coverage goes to the job summary only.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Get-Content "${{ env.coverage }}/SummaryGithub.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: ${{ env.results }}/**/*.trx

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: ${{ env.coverage }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            src/artifacts/package/release/*.nupkg
            src/artifacts/package/release/*.snupkg
          if-no-files-found: error
