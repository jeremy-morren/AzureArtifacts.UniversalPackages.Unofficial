# One pull request per dependency (no groups)
version: 2
updates:
  - package-ecosystem: nuget
    # The solution and Directory.Packages.props (central package management)
    directory: /src
    schedule:
      interval: weekly
    ignore:
      # The library depends on the oldest version of each .NET line it targets (6.0 for netstandard2.0 and net6.0, 8.0
      # for net8.0, 10.0 for net10.0): patches only
      - dependency-name: Microsoft.Extensions.Logging.Abstractions
        update-types: [version-update:semver-major]
      - dependency-name: System.Text.Json
        update-types: [version-update:semver-major]
      # The last versions that support netcoreapp3.1, the oldest test target framework
      - dependency-name: xunit.runner.visualstudio
        versions: [">= 2.5.0"]
      - dependency-name: Microsoft.NET.Test.Sdk
        versions: [">= 17.14.0"]

  - package-ecosystem: github-actions
    # The workflows in .github/workflows
    directory: /
    schedule:
      interval: weekly
